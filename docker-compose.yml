services:
  postgres:
    image: postgres:16
    container_name: poker-trainer-db
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker_trainer
    ports:
      # 5433 назовні, щоб не конфліктувати з локальним postgres на 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker_trainer"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
