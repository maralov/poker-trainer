<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Фон на всю площу і карти в центрі: та сама картинка годиться і як maskable,
       бо Android обрізає до кола радіусом ~40%, а карти лежать усередині нього. -->
  <rect width="512" height="512" fill="#0b0e12"/>
  <circle cx="256" cy="256" r="200" fill="#141a21" stroke="#8a6c2e" stroke-width="6"/>
  <g transform="rotate(-12 256 300)">
    <rect x="142" y="142" width="150" height="214" rx="18" fill="#ede5d5" stroke="#0b0e12" stroke-width="6"/>
    <path transform="translate(186 238) scale(1.1)" fill="#12161b"
      d="M0,-38 C-40,-8 -40,24 -18,26 C-8,27 -2,20 0,14 C2,20 8,27 18,26 C40,24 40,-8 0,-38Z M0,8 L-11,38 L11,38Z"/>
  </g>
  <g transform="rotate(12 256 300)">
    <rect x="220" y="142" width="150" height="214" rx="18" fill="#ede5d5" stroke="#0b0e12" stroke-width="6"/>
    <path transform="translate(295 252) scale(1.35)" fill="#cf4b45"
      d="M0,30 C-42,0 -42,-34 -18,-37 C-6,-38 0,-30 0,-24 C0,-30 6,-38 18,-37 C42,-34 42,0 0,30Z"/>
  </g>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#d4a44c" stroke-width="3" stroke-dasharray="18 22"/>
</svg>
