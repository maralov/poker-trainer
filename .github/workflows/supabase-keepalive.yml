name: Supabase keepalive

# Безкоштовний тариф Supabase ставить проєкт на паузу після ~тижня без запитів,
# і прод лягає (так сталося 10.11.2026). Щоденний запит до таблиці торкається
# Postgres і тримає проєкт активним. Якщо пінг впаде — GitHub надішле лист,
# тобто це ще й сигнал, що база недоступна.
# shortcut: GitHub вимикає розклад у репо без комітів 60 днів (попереджає листом);
# якщо репо надовго затихне — увімкнути workflow заново або перейти на платний тариф.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Anon-ключ публічний (лежить у бандлі); під RLS запит повертає порожній
      # масив, але до бази доходить — цього досить.
      - run: >
          curl --fail-with-body -sS -m 30
          "${{ vars.SUPABASE_URL }}/rest/v1/attempts?select=id&limit=1"
          -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}"
