name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Веб — типи, лінт, тести, збірка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run typecheck
        working-directory: web

      - run: npm run lint
        working-directory: web

      # Ті самі несправжні значення, що й у збірці: `api/supabase.ts` вимагає
      # їх ще на імпорті, тож без них половина тестових файлів не завантажиться.
      # Мережі тести не торкаються — клієнт у них підмінений.
      - run: npm test
        working-directory: web
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      - name: Збірка
        working-directory: web
        # Значення несправжні: збірка лише перевіряє, що бандл збирається.
        # Справжні змінні живуть у Vercel.
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

  database:
    name: База — міграції, RLS, наскрізний синк
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm ci --prefix web

      - name: Підняти локальний Supabase
        run: npx supabase start

      # Тести перевіряють політики RLS: без них ізоляція користувачів
      # трималася б лише на чесному слові, бо anon-ключ публічний.
      - name: Тести RLS і синку
        run: npm run test:db

      - name: Зупинити
        if: always()
        run: npx supabase stop --no-backup
